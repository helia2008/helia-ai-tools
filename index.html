    <script>
        // ==================== 动态粒子背景 ====================
        const canvas = document.getElementById('particle-bg');
        const ctx = canvas.getContext('2d');
        
        let particles = [];
        let mouse = { x: 0, y: 0 };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = '#00f0ff';
                ctx.globalAlpha = 0.6;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function connectParticles() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 120) {
                        ctx.strokeStyle = `rgba(168, 85, 247, ${1 - distance / 120})`;
                        ctx.lineWidth = 0.8;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            connectParticles();
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', e => { mouse.x = e.x; mouse.y = e.y; });

        // ==================== 工具数据 ====================
        const tools = [ /* 你之前的25个工具数组保持不变 */ 
            { name: "ChatGPT", category: "聊天AI", desc: "最强大通用AI", url: "https://chatgpt.com", icon: "🤖" },

            { name: "Gemini", category: "聊天AI", desc: "Google多模态AI", url: "https://gemini.google.com", icon: "🔥" },

            { name: "Midjourney", category: "图像生成", desc: "顶级AI绘画", url: "https://midjourney.com", icon: "🎨" },

            { name: "Leonardo.AI", category: "图像生成", desc: "高质量艺术生成", url: "https://leonardo.ai", icon: "🖌️" },

            { name: "ElevenLabs", category: "语音工具", desc: "AI语音合成", url: "https://elevenlabs.io", icon: "🔊" },

            { name: "CapCut AI", category: "视频工具", desc: "剪映AI功能", url: "https://capcut.com", icon: "✂️" },

            { name: "V0", category: "设计工具", desc: "AI生成UI界面", url: "https://v0.dev", icon: "🖥️" },
            { name: "Luma AI", category: "3D工具", desc: "AI 3D模型生成", url: "https://lumalabs.ai", icon: "🌐" },
            { name: "Ideogram", category: "图像生成", desc: "文字转图像专家", url: "https://ideogram.ai", icon: "✍️" },
            { name: "Kling AI", category: "视频工具", desc: "国产AI视频生成", url: "https://klingai.com", icon: "🇨🇳" },
            { name: "Pika", category: "视频工具", desc: "AI短视频生成", url: "https://pika.art", icon: "🎬" },
            { name: "DALL·E 3", category: "图像生成", desc: "OpenAI图像生成", url: "https://chatgpt.com", icon: "🌟" },
            { name: "Stable Diffusion", category: "图像生成", desc: "开源本地AI绘图", url: "https://stability.ai", icon: "🖼️" },
            { name: "Arcade", category: "游戏工具", desc: "AI游戏生成", url: "https://arcade.dev", icon: "🎮" }
        ];

        function renderTools(filteredTools) {
            const container = document.getElementById('toolsContainer');
            container.innerHTML = '';
            filteredTools.forEach(tool => {
                const card = document.createElement('a');
                card.href = tool.url;
                card.target = "_blank";
                card.className = "glass-card block p-8 rounded-3xl group";
                card.innerHTML = `
                    <div class="text-6xl mb-6 group-hover:scale-110 transition-transform">${tool.icon}</div>
                    <h3 class="text-2xl font-semibold mb-2">${tool.name}</h3>
                    <p class="text-cyan-400 text-sm mb-3">${tool.category}</p>
                    <p class="text-gray-400">${tool.desc}</p>
                    <div class="mt-8 text-xs flex items-center text-cyan-400">
                        <span class="mr-2">立即进入赛博空间</span>
                        <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition"></i>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 搜索功能
        function setupSearch() {
            const input = document.getElementById('searchInput');
            input.addEventListener('input', () => {
                const keyword = input.value.toLowerCase().trim();
                const filtered = tools.filter(t => 
                    t.name.toLowerCase().includes(keyword) ||
                    t.category.toLowerCase().includes(keyword) ||
                    t.desc.toLowerCase().includes(keyword)
                );
                renderTools(filtered.length > 0 ? filtered : tools);
            });
        }

        // 初始化
        window.onload = () => {
            resize();
            for (let i = 0; i < 120; i++) particles.push(new Particle());
            animateParticles();
            renderTools(tools);
            setupSearch();
        };
    </script>
</body>
